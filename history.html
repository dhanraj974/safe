<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>Alert History - SafeSarthi</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <a href="index.html" class="header-logo">🛡️ SafeSarthi</a>
        <div class="header-menu">☰</div>
    </header>

    <!-- Desktop Navigation -->
    <nav class="desktop-nav">
        <a href="index.html">Home</a>
        <a href="contacts.html">Emergency Contacts</a>
        <a href="history.html" class="active">Alert History</a>
        <a href="settings.html">Settings</a>
    </nav>

    <!-- Main Content -->
    <main>
        <h2>Alert History</h2>
        <p>View your past emergency alerts.</p>

        <!-- Clear History Button -->
        <div class="history-actions">
            <button id="clearHistoryButton" class="btn-clear">Clear History</button>

        <!-- History List -->
        <section class="history-list">
            <div id="historyContainer">
                <p class="no-history">No alert history yet.</p>
            </div>
        </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="index.html">
            <span>🏠</span>
            Home
        </a>
        <a href="contacts.html">
            <span>👥</span>

        </a>
        <a href="history.html" class="active">
            <span>📜</span>
            History
        </a>
        <a href="settings.html">
            <span>⚙️</span>
            Settings
        </a>
    </nav>

    <script src="script.js"></script>

</html>
